<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indica+ | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div id="auth-screen" class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-lg border border-slate-100">
        <h1 class="text-2xl font-bold text-center mb-6">Indica<span class="text-indigo-600">Mais</span></h1>
        <input type="email" id="email" placeholder="E-mail" class="w-full p-3 mb-3 border rounded-xl">
        <input type="password" id="password" placeholder="Senha" class="w-full p-3 mb-6 border rounded-xl">
        <button id="login-btn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl mb-2">Entrar</button>
        <button id="register-btn" class="w-full text-slate-500 text-sm">Criar conta nova</button>
    </div>

    <div id="app-screen" class="hidden w-full max-w-sm bg-white p-8 rounded-3xl shadow-lg">
        <h2 class="text-xl font-bold mb-4">Olá!</h2>
        <p id="user-info" class="mb-4 text-sm text-slate-600"></p>
        <button id="logout-btn" class="w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl">Sair</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0q0agSZcI-agco2QT8Y3Q4my-ydPVVgs",
            databaseURL: "https://indica-mais-ce824-default-rtdb.firebaseio.com",
            projectId: "indica-mais-ce824"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Alternar telas
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-info').innerText = "Logado como: " + user.email;
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        // Botão Entrar
        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .catch(err => alert(err.message));
        });

        // Botão Cadastrar
        document.getElementById('register-btn').addEventListener('click', () => {
            createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .catch(err => alert(err.message));
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
    </script>
</body>
</html>
