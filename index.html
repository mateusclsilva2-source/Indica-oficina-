<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indica+ | Rede</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4">

    <!-- Login -->
    <div id="login-box" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl mt-10">
        <h1 class="text-2xl font-bold text-center mb-6">Indica<span class="text-indigo-600">Mais</span></h1>
        <input type="text" id="user-name" placeholder="Seu nome" class="w-full p-4 mb-4 bg-slate-50 border rounded-2xl">
        <button id="enter-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl">Entrar / Registrar</button>
    </div>

    <!-- Painel -->
    <div id="app-box" class="hidden max-w-md mx-auto bg-white p-6 rounded-3xl shadow-xl mt-10">
        <h2 class="text-lg font-bold">Olá, <span id="display-name"></span>!</h2>
        <p class="text-indigo-600 font-bold mb-4">Seu Código: <span id="my-code" class="text-2xl"></span></p>

        <!-- Formulário de Indicação -->
        <div class="bg-slate-50 p-4 rounded-2xl mb-6">
            <input type="text" id="new-indicated-name" placeholder="Nome do indicado" class="w-full p-3 mb-2 rounded-xl border">
            <input type="text" id="ref-code-used" placeholder="Código de quem te indicou" class="w-full p-3 mb-2 rounded-xl border">
            <button id="register-ref-btn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Registrar Indicação</button>
        </div>

        <!-- Quadro de Indicações -->
        <h3 class="font-bold mb-2">Quem você indicou:</h3>
        <ul id="ref-list" class="space-y-2 text-sm text-slate-600"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, update, push, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const db = getDatabase(initializeApp({
            databaseURL: "https://indica-mais-ce824-default-rtdb.firebaseio.com"
        }));

        let userName = "";
        let userCode = "";

        document.getElementById('enter-btn').addEventListener('click', async () => {
            userName = document.getElementById('user-name').value.trim();
            userCode = userName.substring(0,3).toUpperCase() + Math.floor(Math.random()*900);
            
            await update(ref(db, 'usuarios/' + userName), { nome: userName, codigo: userCode });
            
            document.getElementById('display-name').innerText = userName;
            document.getElementById('my-code').innerText = userCode;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('app-box').classList.remove('hidden');
            carregarQuadro();
        });

        document.getElementById('register-ref-btn').addEventListener('click', async () => {
            const indicado = document.getElementById('new-indicated-name').value;
            const codigoIndicador = document.getElementById('ref-code-used').value;
            
            // Salva na lista do indicador
            push(ref(db, 'usuarios/' + userName + '/indicados'), { nome: indicado, data: new Date().toLocaleDateString() });
            alert("Indicação registrada!");
            carregarQuadro();
        });

        async function carregarQuadro() {
            const list = document.getElementById('ref-list');
            list.innerHTML = "";
            const snap = await get(ref(db, 'usuarios/' + userName + '/indicados'));
            if(snap.exists()){
                snap.forEach(child => {
                    list.innerHTML += `<li class="bg-indigo-50 p-2 rounded-lg">${child.val().nome}</li>`;
                });
            }
        }
    </script>
</body>
</html>
