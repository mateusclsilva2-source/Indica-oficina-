
    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indica+ | Gerenciador de Indicações</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold text-xl tracking-tight">I+</div>
                <span class="font-bold text-xl text-slate-900">Indica<span class="text-indigo-600">Mais</span></span>
            </div>
            <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg border border-slate-200">Painel de Controle</span>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">
        <div id="copy-modal" class="hidden bg-emerald-50 border border-emerald-200 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
            <div>
                <p class="text-emerald-800 font-bold text-sm">✓ Novo código gerado com sucesso!</p>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <span id="generated-code-display" class="bg-white border border-emerald-200 font-mono font-bold text-emerald-700 px-3 py-2 rounded-xl text-sm flex-1 text-center"></span>
                <button id="copy-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-xl text-xs cursor-pointer">Copiar</button>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="font-bold text-lg mb-4">1. Criar Código Cliente Base</h2>
                <form id="base-form" class="space-y-4">
                    <input type="text" id="base-name" required placeholder="Ex: João Silva" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm">
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl text-sm">Gerar Código Base</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="font-bold text-lg mb-4">2. Confirmar Indicação</h2>
                <form id="referral-form" class="space-y-4">
                    <input type="text" id="new-client-name" required placeholder="Nome do Novo Cliente" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm">
                    <input type="text" id="referrer-code" required placeholder="Código do Padrinho (Ex: JOAO345)" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm uppercase">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl text-sm">Confirmar Indicação</button>
                </form>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-slate-100"><h2 class="font-bold text-lg">📊 Relatório de Códigos</h2></div>
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-slate-400 text-xs uppercase">
                    <tr><th class="p-4">Cliente</th><th class="p-4">Código</th><th class="p-4">Indicador</th><th class="p-4 text-center">Indicações</th></tr>
                </thead>
                <tbody id="table-body" class="text-sm divide-y text-slate-600"></tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0q0agSZcI-agco2QT8Y3Q4my-ydPVVgs",
            databaseURL: "https://indica-mais-ce824-default-rtdb.firebaseio.com",
            projectId: "indica-mais-ce824"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        let database = {};

        async function loadDatabase() {
            const snapshot = await get(child(ref(db), 'clientes'));
            database = snapshot.exists() ? snapshot.val() : {};
            renderTable();
        }

        async function save() {
            await set(ref(db, 'clientes'), database);
            renderTable();
        }

        function generateCode(name) {
            let code = (name.trim().substring(0,4).toUpperCase().replace(/[^A-Z]/g, '')) + Math.floor(100 + Math.random() * 900);
            return database[code] ? generateCode(name) : code;
        }

        document.getElementById('base-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('base-name').value;
            const code = generateCode(name);
            database[code] = { name, code, origin: 'Direto', count: 0 };
            await save();
            showCopyBox(code);
            document.getElementById('base-form').reset();
        });

        document.getElementById('referral-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('new-client-name').value;
            const refCode = document.getElementById('referrer-code').value.toUpperCase();
            if (!database[refCode]) return alert("Código não encontrado!");
            const code = generateCode(name);
            database[code] = { name, code, origin: refCode, count: 0 };
            database[refCode].count += 1;
            await save();
            showCopyBox(code);
            document.getElementById('referral-form').reset();
        });

        function showCopyBox(code) {
            document.getElementById('generated-code-display').innerText = code;
            document.getElementById('copy-modal').classList.remove('hidden');
        }

        document.getElementById('copy-btn').addEventListener('click', () => {
            const code = document.getElementById('generated-code-display').innerText;
            navigator.clipboard.writeText(code);
            alert("Código copiado!");
        });

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = Object.values(database).map(item => `
                <tr>
                    <td class="p-4 font-semibold">${item.name}</td>
                    <td class="p-4 font-mono text-indigo-600 font-bold">${item.code}</td>
                    <td class="p-4 text-xs">${item.origin}</td>
                    <td class="p-4 text-center font-bold">${item.count}</td>
                </tr>
            `).join('');
        }

        loadDatabase();
    </script>
</body>
</html>
