<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indica+ | Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4">

    <!-- Tela de Login -->
    <div id="login-box" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl mt-10">
        <h1 class="text-2xl font-bold text-center mb-6">Indica<span class="text-indigo-600">Mais</span></h1>
        <input type="text" id="user-name" placeholder="Seu nome real" class="w-full p-4 mb-4 bg-slate-50 border rounded-2xl">
        <button id="enter-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl">Entrar / Registrar</button>
    </div>

    <!-- Painel -->
    <div id="app-box" class="hidden max-w-md mx-auto bg-white p-6 rounded-3xl shadow-xl mt-10">
        <button onclick="location.reload()" class="text-sm text-slate-400 mb-4">← Voltar à tela inicial</button>
        
        <h2 class="text-xl font-bold">Olá, <span id="display-name"></span>!</h2>
        <p class="text-indigo-600 font-bold mb-6">Seu Código: <span id="my-code" class="text-xl"></span></p>

        <div class="space-y-3 mb-8">
            <input type="text" id="new-indicated-name" placeholder="Nome do indicado" class="w-full p-3 rounded-xl border bg-slate-50">
            <input type="text" id="ref-code-used" placeholder="Código de quem te indicou" class="w-full p-3 rounded-xl border bg-slate-50">
            <button id="register-ref-btn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Registrar Indicação</button>
        </div>

        <h3 class="font-bold mb-3 border-b pb-2">Quem você indicou:</h3>
        <ul id="ref-list" class="space-y-2 text-sm text-slate-700"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, update, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const db = getDatabase(initializeApp({ databaseURL: "https://indica-mais-ce824-default-rtdb.firebaseio.com" }));

        let nomeUsuarioAtual = "";

        // Função para carregar a lista do banco
        async function carregarQuadro(nome) {
            const list = document.getElementById('ref-list');
            list.innerHTML = "";
            const snap = await get(ref(db, 'usuarios/' + nome + '/indicados'));
            if(snap.exists()){
                snap.forEach(child => {
                    list.innerHTML += `<li class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">👤 ${child.val().nome}</li>`;
                });
            }
        }

        document.getElementById('enter-btn').addEventListener('click', async () => {
            const name = document.getElementById('user-name').value.trim();
            if (name.length < 3) return alert("Digite um nome válido.");
            
            nomeUsuarioAtual = name;
            const code = name.substring(0,3).toUpperCase() + "381"; // Mantendo seu código padrão
            
            await update(ref(db, 'usuarios/' + name), { nome: name, codigo: code });
            
            document.getElementById('display-name').innerText = name;
            document.getElementById('my-code').innerText = code;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('app-box').classList.remove('hidden');
            
            carregarQuadro(name); // Carrega a lista automaticamente
        });

        document.getElementById('register-ref-btn').addEventListener('click', async () => {
            const indicado = document.getElementById('new-indicated-name').value.trim();
            if (indicado.length < 3) return alert("Nome do indicado muito curto.");
            
            await push(ref(db, 'usuarios/' + nomeUsuarioAtual + '/indicados'), { nome: indicado });
            document.getElementById('new-indicated-name').value = ""; // Limpa campo
            alert("Indicação registrada!");
            carregarQuadro(nomeUsuarioAtual); // Atualiza o quadro imediatamente
        });
    </script>
</body>
</html>
