<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indica+ | Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4">

    <div id="login-box" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl mt-10 text-center">
        <h1 class="text-3xl font-bold mb-6">Indica<span class="text-indigo-600">Mais</span></h1>
        <button id="login-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl">Acessar Meu Painel</button>
    </div>

    <div id="app-box" class="hidden max-w-md mx-auto bg-white p-6 rounded-3xl shadow-xl mt-10">
        <h2 class="text-xl font-bold mb-4">Seu Painel</h2>
        <p class="text-indigo-600 font-bold mb-6">Código: <span id="my-code">...</span></p>
        
        <div class="space-y-3 mb-8">
            <input type="text" id="new-indicated-name" placeholder="Nome do indicado" class="w-full p-3 rounded-xl border bg-slate-50">
            <button id="add-btn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Registrar</button>
        </div>

        <ul id="list" class="space-y-2 text-sm text-slate-700"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Substitua abaixo com seus dados reais do Firebase
        const firebaseConfig = { /* SEUS DADOS AQUI */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let uid = null;

        // 1. Botão de Login
        document.getElementById('login-btn').addEventListener('click', () => {
            signInAnonymously(auth).catch(err => alert("Erro ao logar: " + err.message));
        });

        // 2. Monitor de estado de login (A mágica acontece aqui)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                uid = user.uid;
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('app-box').classList.remove('hidden');
                carregarDados();
            }
        });

        function carregarDados() {
            // Carrega código
            get(ref(db, `users/${uid}/code`)).then(snap => {
                if(!snap.exists()) {
                    const code = "LOJA" + Math.floor(1000 + Math.random() * 9000);
                    push(ref(db, `users/${uid}/code`), code);
                    document.getElementById('my-code').innerText = code;
                } else {
                    document.getElementById('my-code').innerText = snap.val();
                }
            });

            // Carrega lista de indicados
            onValue(ref(db, `users/${uid}/indicados`), (snap) => {
                const list = document.getElementById('list');
                list.innerHTML = "";
                snap.forEach(c => list.innerHTML += `<li class="p-3 bg-slate-50 rounded-xl border">${c.val().nome}</li>`);
            });
        }

        document.getElementById('add-btn').addEventListener('click', async () => {
            const nome = document.getElementById('new-indicated-name').value;
            if(nome) {
                await push(ref(db, `users/${uid}/indicados`), { nome });
                document.getElementById('new-indicated-name').value = "";
            }
        });
    </script>
</body>
</html>
