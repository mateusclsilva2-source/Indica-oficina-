<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indica+ | Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div id="login-box" class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
        <h1 class="text-2xl font-bold text-center mb-6">Indica<span class="text-indigo-600">Mais</span></h1>
        <input type="text" id="user-key" placeholder="Digite seu nome ou código" class="w-full p-4 mb-4 bg-slate-50 border border-slate-200 rounded-2xl">
        <button id="enter-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl">Entrar no Painel</button>
    </div>

    <div id="app-box" class="hidden w-full max-w-sm bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
        <h2 class="text-lg font-bold mb-4 text-slate-800">Olá, <span id="display-user"></span>!</h2>
        
        <div class="p-6 bg-indigo-50 rounded-3xl text-center mb-6 border border-indigo-100">
            <p class="text-xs text-indigo-600 font-bold uppercase tracking-widest">Suas Indicações</p>
            <p id="count" class="text-5xl font-black text-indigo-700 my-2">0</p>
        </div>

        <button id="add-ref" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-2xl mb-3 shadow-lg shadow-emerald-200">Registrar Indicação</button>
        <button onclick="location.reload()" class="w-full bg-slate-100 text-slate-600 font-bold py-4 rounded-2xl">Sair</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, update, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0q0agSZcI-agco2QT8Y3Q4my-ydPVVgs",
            databaseURL: "https://indica-mais-ce824-default-rtdb.firebaseio.com",
            projectId: "indica-mais-ce824"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        let currentUser = "";

        // Entrar
        document.getElementById('enter-btn').addEventListener('click', async () => {
            currentUser = document.getElementById('user-key').value.trim();
            if (!currentUser) return alert("Digite algo!");

            const userRef = ref(db, 'usuarios/' + currentUser);
            const snapshot = await get(userRef);
            
            if (!snapshot.exists()) {
                await update(userRef, { nome: currentUser, indicações: 0 });
            }

            document.getElementById('display-user').innerText = currentUser;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('app-box').classList.remove('hidden');
            
            // Atualiza o contador na tela
            const data = (await get(userRef)).val();
            document.getElementById('count').innerText = data.indicações;
        });

        // Registrar nova indicação
        document.getElementById('add-ref').addEventListener('click', async () => {
            const userRef = ref(db, 'usuarios/' + currentUser);
            await update(userRef, { indicações: increment(1) });
            const newData = (await get(userRef)).val();
            document.getElementById('count').innerText = newData.indicações;
        });
    </script>
</body>
</html>
