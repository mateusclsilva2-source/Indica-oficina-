<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indica+ | Multinível</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4">

    <!-- Login -->
    <div id="login-box" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl mt-10">
        <h1 class="text-2xl font-bold text-center mb-6">Indica<span class="text-indigo-600">Mais</span></h1>
        <input type="text" id="user-name" placeholder="Seu nome completo" class="w-full p-4 mb-4 bg-slate-50 border rounded-2xl">
        <button id="enter-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl">Acessar Painel</button>
    </div>

    <!-- Painel -->
    <div id="app-box" class="hidden max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl mt-10">
        <h2 class="text-xl font-bold mb-1">Olá, <span id="display-name"></span>!</h2>
        <p class="text-sm text-slate-500 mb-6">Seu código: <strong id="my-code" class="text-indigo-600"></strong></p>
        
        <!-- Gráfico de Metas -->
        <div class="mb-8">
            <div class="flex justify-between text-xs font-bold mb-2">
                <span>Meta de Prêmios</span>
                <span id="points-count">0/10 Indicações</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-500"></div>
            </div>
        </div>

        <input type="text" id="new-ref" placeholder="Nome do indicado" class="w-full p-4 mb-3 bg-slate-50 border rounded-2xl">
        <button id="add-ref-btn" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-2xl mb-6">Registrar Indicação</button>
        
        <button onclick="location.reload()" class="w-full text-slate-400 text-sm">Sair</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get, update, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const db = getDatabase(initializeApp({
            databaseURL: "https://indica-mais-ce824-default-rtdb.firebaseio.com"
        }));

        let userName = "";

        document.getElementById('enter-btn').addEventListener('click', async () => {
            userName = document.getElementById('user-name').value.trim();
            const code = userName.substring(0,3).toUpperCase() + "123"; // Código simples
            
            const userRef = ref(db, 'usuarios/' + userName);
            const snap = await get(userRef);
            if(!snap.exists()) await update(userRef, { pontos: 0 });

            document.getElementById('display-name').innerText = userName;
            document.getElementById('my-code').innerText = code;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('app-box').classList.remove('hidden');
            atualizarInterface();
        });

        async function atualizarInterface() {
            const snap = await get(ref(db, 'usuarios/' + userName));
            const pontos = snap.val().pontos;
            document.getElementById('points-count').innerText = `${pontos}/10 Indicações`;
            document.getElementById('progress-bar').style.width = (pontos * 10) + "%";
        }

        document.getElementById('add-ref-btn').addEventListener('click', async () => {
            await update(ref(db, 'usuarios/' + userName), { pontos: increment(1) });
            atualizarInterface();
            alert("Indicação registrada com sucesso!");
        });
    </script>
</body>
</html>
